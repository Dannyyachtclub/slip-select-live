<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slip Select — Live Desk</title>
<style>
:root{
  --bg:#05070d; --bg2:#080a13; --surface:#0b0e19; --surface2:#101527; --inset:#070912;
  --line:#262c47; --line-soft:#1a1f36; --line-faint:#12162a;
  --ink:#f4efe3; --mut:#a7adc0; --dim:#6f7690;
  --gold:#c8a24a; --gold-hi:#eed188;
  --pos:#43c98a; --neg:#e46565; --amb:#e0a44e; --cyan:#72c7dc; --vio:#a48fe0;
  --serif:Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.55}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.pos{color:var(--pos)} .neg{color:var(--neg)} .amb{color:var(--amb)}
.mut{color:var(--mut)} .dim{color:var(--dim)}
a{color:var(--gold-hi)}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:0 14px 48px}

/* ---------- top bar ---------- */
.topbar{background:rgba(5,7,13,.97);border-bottom:1px solid var(--line-soft);padding:12px 14px}
.topbar-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand-name{font-family:var(--serif);font-weight:700;font-size:1.15rem;letter-spacing:.18em}
.brand-sub{font-size:.68rem;font-weight:700;letter-spacing:.28em;color:var(--gold);text-transform:uppercase}
.dot{width:9px;height:9px;border-radius:50%;background:var(--pos);display:inline-block;flex:0 0 auto}
.updated{margin-left:auto;font-size:.85rem;color:var(--mut)}

/* ---------- banner: the five kings ---------- */
.banner{margin-top:16px}
.banner-kings{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
@media(min-width:700px){.banner-kings{gap:12px}}
.bk{background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;overflow:hidden;text-align:center}
.bk.grand{border-color:rgba(200,162,74,.65)}
.bk .ph{height:84px;overflow:hidden}
@media(min-width:700px){.bk .ph{height:150px}}
@media(min-width:1024px){.bk .ph{height:180px}}
.bk img{width:100%;height:100%;object-fit:cover;display:block;animation:kb 22s ease-in-out infinite alternate}
.bk:nth-child(2) img{animation-duration:27s;animation-delay:-7s}
.bk:nth-child(3) img{animation-duration:24s;animation-delay:-13s}
.bk:nth-child(4) img{animation-duration:29s;animation-delay:-4s}
.bk:nth-child(5) img{animation-duration:25s;animation-delay:-17s}
@keyframes kb{from{transform:scale(1.03) translate(0,0)}to{transform:scale(1.16) translate(-2.5%,2%)}}
.bk .bk-nm{font-weight:800;font-size:.86rem;line-height:1.2;padding:8px 4px 0}
@media(min-width:700px){.bk .bk-nm{font-size:1.05rem}}
.bk .bk-grand{font-size:.62rem;font-weight:800;letter-spacing:.14em;color:var(--gold-hi);padding-top:1px}
.bk .bk-chip{font-size:.8rem;color:var(--mut);padding:2px 4px 10px}
@media(min-width:700px){.bk .bk-chip{font-size:.92rem}}
.bk .bk-chip .num{font-weight:800}

/* ---------- gliding ticker ---------- */
.ticker{overflow:hidden;border:1px solid var(--line-soft);border-radius:10px;background:var(--surface);
  margin-top:10px;cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.ticker:active{cursor:grabbing}
.ticker-track{display:inline-flex;align-items:center;white-space:nowrap;padding:10px 0;will-change:transform}
.tick-item{padding:0 6px;font-size:.95rem;color:var(--mut)}
.tick-item .num{color:var(--ink);font-weight:700}
.tick-dot{color:var(--gold);padding:0 2px}

/* ---------- tab bar ---------- */
.tabbar{position:sticky;top:0;z-index:60;background:rgba(5,7,13,.97);
  border-bottom:1px solid var(--line);margin-top:18px}
.tabbar-in{max-width:1100px;margin:0 auto;display:flex;padding:0 6px}
.tabbtn{flex:1 1 0;min-width:0;min-height:48px;background:none;border:0;border-bottom:3px solid transparent;
  color:var(--mut);font-family:var(--sans);font-size:.9rem;font-weight:700;cursor:pointer;padding:12px 2px 9px}
@media(min-width:700px){.tabbtn{font-size:1rem}}
.tabbtn[aria-selected="true"]{color:var(--gold-hi);border-bottom-color:var(--gold)}

/* ---------- headings ---------- */
h2.sec{font-size:1.35rem;line-height:1.25;margin:34px 0 4px;font-weight:800}
.tabpane > h2.sec:first-child{margin-top:24px}
.sec-sub{color:var(--mut);font-size:.98rem;margin:0 0 14px}
h3{font-size:1.08rem;margin:0 0 6px}

/* ---------- big stat cards ---------- */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
@media(min-width:620px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;padding:14px}
.stat .l{font-size:.78rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.stat .v{font-size:1.55rem;font-weight:800;line-height:1.2;margin-top:2px}
.stat .s{font-size:.88rem;color:var(--mut)}

/* ---------- generic cards ---------- */
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;padding:16px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid var(--line-faint)}
.row:last-child{border-bottom:0}
.row .k{color:var(--mut)}
.row .v{font-weight:700;text-align:right}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.8rem;font-weight:800;
  letter-spacing:.06em;background:rgba(200,162,74,.16);color:var(--gold-hi);border:1px solid rgba(200,162,74,.6)}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;border:1px solid var(--line);
  font-size:.78rem;font-weight:700;color:var(--mut)}
.res-WON{color:var(--pos);font-weight:800}.res-LOST{color:var(--neg);font-weight:800}
.res-PUSH,.res-VOID{color:var(--amb);font-weight:800}

/* ---------- king cards ---------- */
.kings-grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:700px){.kings-grid{grid-template-columns:1fr 1fr}}
@media(min-width:1024px){.kings-grid{grid-template-columns:repeat(3,1fr)}}
.king{padding:0;overflow:hidden;margin-bottom:0}
.king-head{display:flex;gap:14px;align-items:center;padding:16px 16px 10px}
.king-head img{width:64px;height:64px;border-radius:10px;object-fit:cover;border:1px solid var(--line);flex:0 0 auto}
.king-name{font-size:1.6rem;font-weight:900;line-height:1.1}
.king-sub{color:var(--mut);font-size:.92rem;margin-top:2px}
.king-body{padding:0 16px 16px}
.linebox{background:var(--inset);border:1px solid var(--line-faint);border-radius:10px;padding:12px 14px;margin-top:10px}
.linebox .t{font-size:.8rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.linebox .big{font-size:1.25rem;font-weight:800;margin-top:2px}
.linebox.live{border-color:rgba(67,201,138,.35)}
.rulename{font-size:.8rem;color:var(--dim);word-break:break-word;margin-top:10px}

/* ---------- comparison table + bars ---------- */
table{width:100%;border-collapse:collapse;background:var(--surface);
  border:1px solid var(--line-soft);border-radius:12px;overflow:hidden}
th{text-align:left;color:var(--dim);font-size:.78rem;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;padding:12px;border-bottom:1px solid var(--line);background:var(--inset)}
td{padding:12px;border-bottom:1px solid var(--line-faint);font-size:1rem;vertical-align:top}
tr:last-child td{border-bottom:0}
@media(max-width:560px){
  table,thead,tbody,tr,td{display:block;width:100%}
  thead{display:none}
  tr{border-bottom:1px solid var(--line);padding:8px 0}
  tr:last-child{border-bottom:0}
  td{border-bottom:0;padding:5px 14px}
  td::before{content:attr(data-l);display:block;font-size:.75rem;font-weight:700;
    letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
}
.bar-row{margin:12px 0}
.bar-lab{display:flex;justify-content:space-between;gap:10px;font-weight:700;margin-bottom:4px}
.bar-track{background:var(--inset);border:1px solid var(--line-faint);border-radius:6px;height:22px;overflow:hidden}
.bar-fill{height:100%}
.bar-fill.p{background:var(--pos)} .bar-fill.n{background:var(--neg)}

/* ---------- ROI paired bars (zero-centred) ---------- */
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--mut);font-size:.92rem;margin-bottom:6px}
.sw{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:6px}
.sw.fit{background:var(--gold)} .sw.liv{background:var(--cyan)}
.roi-block{padding:10px 0;border-bottom:1px solid var(--line-faint)}
.roi-block:last-child{border-bottom:0}
.roi-name{font-weight:800;font-size:1.02rem;margin-bottom:4px}
.roi-row{display:flex;align-items:center;gap:10px;margin:4px 0}
.roi-lab{flex:0 0 52px;font-size:.82rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.roi-track{position:relative;flex:1;height:20px;background:var(--inset);border:1px solid var(--line-faint);border-radius:6px;overflow:hidden}
.roi-zero{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line)}
.roi-bar{position:absolute;top:0;bottom:0}
.roi-bar.fit{background:var(--gold)} .roi-bar.liv{background:var(--cyan)}
.roi-val{flex:0 0 76px;text-align:right;font-weight:700}

/* ---------- wins / losses stacked bars ---------- */
.stack-track{display:flex;height:22px;border:1px solid var(--line-faint);border-radius:6px;overflow:hidden;background:var(--inset)}
.stack-w{background:var(--pos);height:100%}
.stack-l{background:var(--neg);height:100%;flex:1}
.stack-lab{display:flex;justify-content:space-between;gap:10px;font-size:.9rem;margin-top:3px}

/* ---------- lists ---------- */
.item{padding:10px 0;border-bottom:1px solid var(--line-faint)}
.item:last-child{border-bottom:0}
.item .t{font-weight:700}
.item .s{color:var(--mut);font-size:.93rem}

/* ---------- tucked sections ---------- */
details{background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;margin-bottom:12px}
details summary{cursor:pointer;min-height:44px;display:flex;align-items:center;gap:8px;
  padding:12px 16px;font-weight:800;font-size:1.05rem;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";margin-left:auto;color:var(--gold-hi);font-size:1.3rem}
details[open ] summary::after{content:"\2212"}
details .inner{padding:0 16px 16px}
.err{background:rgba(228,101,101,.12);border:1px solid rgba(228,101,101,.5);border-radius:12px;
  padding:16px;color:var(--ink)}
.proof-note{border:1px solid rgba(224,164,78,.55);background:rgba(224,164,78,.10);border-radius:10px;
  padding:12px 14px;margin-top:12px}
footer{color:var(--dim);font-size:.88rem;margin-top:36px;text-align:center}

/* ---------- today: locked-slip game cards ---------- */
.gcard{background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.gcard .mu{font-size:1.12rem;font-weight:800;line-height:1.3}
.gcard .meta{color:var(--mut);font-size:.9rem;margin-top:2px}
.gcard .cd{display:inline-block;margin-top:8px;padding:3px 10px;border-radius:999px;
  border:1px solid rgba(114,199,220,.55);color:var(--cyan);font-weight:800;font-size:.85rem}
.gcard .cd.inplay{border-color:rgba(224,164,78,.6);color:var(--amb)}
.gcard .cardpick{margin-top:8px;font-size:1rem}
.kchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.kchip{border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:.78rem;color:var(--mut)}
.kchip b{color:var(--ink)}
.gbadges{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

/* ---------- form strips (one block per graded slip) ---------- */
.formlab{font-size:.8rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-top:12px}
.formstrip{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.fblock{width:22px;height:22px;border-radius:5px;border:1px solid var(--line-faint)}
.fblock.w{background:var(--pos)} .fblock.l{background:var(--neg)} .fblock.z{background:var(--surface2)}

/* ---------- freshest result ---------- */
.card.fresh{border-color:rgba(200,162,74,.65)}
.winbanner{margin-top:10px;border:1px solid rgba(67,201,138,.55);background:rgba(67,201,138,.12);
  border-radius:10px;padding:10px 12px;font-weight:800}
.winbanner .num{color:var(--pos)}
@media (prefers-reduced-motion: no-preference){
  .winbanner{animation:winpulse 2.6s ease-in-out infinite}
  @keyframes winpulse{0%,100%{box-shadow:0 0 0 0 rgba(67,201,138,0)}50%{box-shadow:0 0 0 5px rgba(67,201,138,.14)}}
}

@media (prefers-reduced-motion: reduce){
  .bk img{animation:none}
}
</style>
</head>
<body>
<header class="topbar"><div class="topbar-in">
  <div><div class="brand-name">SLIP SELECT</div><div class="brand-sub">Live Desk</div></div>
  <span class="dot" id="dot"></span>
  <div class="updated" id="updated">Loading…</div>
</div></header>

<div class="wrap" style="padding-bottom:0">
  <div id="fatal"></div>
  <section class="banner" aria-label="The five kings">
    <div class="banner-kings" id="banner-kings"><p class="mut">Loading the desk…</p></div>
    <div class="ticker" id="ticker" aria-label="Key figures"><div class="ticker-track" id="ticker-track"></div></div>
  </section>
</div>

<nav class="tabbar" id="tabbar"><div class="tabbar-in" role="tablist" aria-label="Desk sections">
  <button class="tabbtn" data-tabbtn="overview" aria-selected="true" onclick="showTab('overview')">Overview</button>
  <button class="tabbtn" data-tabbtn="kings" aria-selected="false" onclick="showTab('kings')">Kings</button>
  <button class="tabbtn" data-tabbtn="compare" aria-selected="false" onclick="showTab('compare')">Compare</button>
  <button class="tabbtn" data-tabbtn="slips" aria-selected="false" onclick="showTab('slips')">Slips</button>
  <button class="tabbtn" data-tabbtn="bets" aria-selected="false" onclick="showTab('bets')">Bets</button>
  <button class="tabbtn" data-tabbtn="more" aria-selected="false" onclick="showTab('more')">More</button>
</div></nav>

<main class="wrap" id="app">
  <div id="content"><p class="mut">Loading the desk…</p></div>
  <footer>Slip Select — every number on this page comes straight from the programme's own record.</footer>
</main>

<script>
/* ============ Slip Select Live Desk — renders entirely from status.json ============ */
const COURT_IMG = {Legacy:"assets/legacy.jpg",Regime:"assets/regime.jpg",Quantum:"assets/quantum.jpg",Selector:"assets/selector.jpg",Vanguard:"assets/vanguard.jpg"};
const AGENT_IMG = {Legacy:"assets/legacy.jpg",Regime:"assets/regime.jpg",Quantum:"assets/quantum.jpg",Selector:"assets/selector.jpg",Vanguard:"assets/vanguard.jpg",Arena:"assets/arena.jpg",Discovery:"assets/discovery.jpg","Edge Finder":"assets/edgefinder.jpg","Loss Autopsy":"assets/autopsy.jpg",Stakehunter:"assets/stakehunter.jpg","Research Director":"assets/director.jpg",Vault:"assets/vault.jpg"};
let S = null;
let activeTab = "overview";
const RM = (typeof matchMedia === "function") ? matchMedia("(prefers-reduced-motion: reduce)").matches : false;

function esc(x){return String(x==null?"":x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function num(x){return x==null?"—":String(x);}
function m(x){return x==null?"—":String(x)+"m";}
function pct(x){return x==null?"—":String(x)+"%";}
function cls(x){return (typeof x==="number"&&x<0)?"neg":(typeof x==="number"&&x>0)?"pos":"";}
function rec(w,l){return num(w)+"-"+num(l);}
function when(ts){
  if(!ts) return "—";
  const d=new Date(ts);
  return isNaN(d)?esc(ts):d.toLocaleString("en-CA",{timeZone:"America/Regina",dateStyle:"medium",timeStyle:"short"});
}
function fwdKing(court){
  const ks=(S.forward&&S.forward.kings)||[];
  for(const k of ks){ if(k.court===court) return k; }
  return null;
}

/* ---------- banner: king photos + live chips ---------- */
function bannerHTML(){
  const e2=(S.forward&&S.forward.era2)||null;
  const e2k={};
  if(e2){ for(const x of (e2.kings||[])) e2k[x.court]=x; }
  return (S.kings||[]).map(k=>{
    const f=fwdKing(k.court)||{};
    const e=e2k[k.court]||null;
    const chip=e
      ?'<div class="bk-chip">ERA 2 <span class="num '+cls(e.pnl_m)+'">'+m(e.pnl_m)+'</span> &middot; Bal '+m(e.balance_m)+'</div>'
      :'<div class="bk-chip">Live <span class="num '+cls(f.pnl_m)+'">'+m(f.pnl_m)+'</span></div>';
    return '<div class="bk'+(k.grand_king?" grand":"")+'"><div class="ph"><img src="'+esc(COURT_IMG[k.court]||"")+'" alt="'+esc(k.court)+'"></div>'
      +'<div class="bk-nm">'+esc(k.court)+'</div>'
      +(k.grand_king?'<div class="bk-grand">GRAND KING</div>':"")
      +chip+'</div>';
  }).join("");
}

/* ---------- ticker: real figures only, slow glide, drag to move ---------- */
function tickerGroup(){
  const b=S.bankroll||{}, f=S.forward||{}, v=S.vault||{};
  const items=[
    'Settled P&amp;L <span class="num '+cls(b.settled_pnl_m)+'">'+m(b.settled_pnl_m)+'</span>',
    'Record <span class="num">'+esc(b.record||rec(b.wins,b.losses))+'</span>',
    'Staked <span class="num">'+m(b.settled_staked_m)+'</span>',
    'ROI <span class="num '+cls(b.roi_pct)+'">'+pct(b.roi_pct)+'</span>'
  ];
  for(const k of (f.kings||[])){
    items.push(esc(k.court)+' live <span class="num '+cls(k.pnl_m)+'">'+m(k.pnl_m)+'</span>');
  }
  items.push('Live games graded <span class="num">'+num(f.games)+'</span>');
  items.push('Vault <span class="num">'+num(v.count)+' games</span>');
  return items.map(i=>'<span class="tick-item">'+i+'</span>').join('<span class="tick-dot">&bull;</span>')+'<span class="tick-dot">&bull;</span>';
}
let tickPos=0, tickHalf=0, tickDrag=null, tickStarted=false;
function wrapPos(p){
  if(!tickHalf) return p;
  while(p<=-tickHalf) p+=tickHalf;
  while(p>0) p-=tickHalf;
  return p;
}
function applyTick(){
  const t=document.getElementById("ticker-track");
  if(t) t.style.transform="translateX("+tickPos+"px)";
}
function tickerStart(){
  if(tickStarted) return;
  const view=document.getElementById("ticker"), track=document.getElementById("ticker-track");
  if(!view||!track||typeof requestAnimationFrame!=="function") return;
  tickStarted=true;
  const measure=()=>{ tickHalf=track.scrollWidth/2; };
  measure();
  if(typeof window!=="undefined"&&window.addEventListener) window.addEventListener("resize",measure);
  view.addEventListener("pointerdown",e=>{ tickDrag={x:e.clientX,pos:tickPos}; if(view.setPointerCapture) view.setPointerCapture(e.pointerId); });
  view.addEventListener("pointermove",e=>{ if(tickDrag){ tickPos=wrapPos(tickDrag.pos+(e.clientX-tickDrag.x)); applyTick(); } });
  const end=()=>{ tickDrag=null; };
  view.addEventListener("pointerup",end);
  view.addEventListener("pointercancel",end);
  applyTick();
  if(RM) return;
  let last=null, frames=0;
  const step=ts=>{
    if(last==null) last=ts;
    const dt=Math.min((ts-last)/1000,0.1); last=ts;
    frames++;
    if(frames%120===0) measure();
    if(!tickDrag){ tickPos=wrapPos(tickPos-28*dt); applyTick(); }
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

/* ---------- 0. today: the locked slip, game by game, live tip countdowns ---------- */
function cdText(tip){
  if(!tip) return "";
  const t=new Date(tip).getTime();
  if(isNaN(t)) return "";
  const diff=t-Date.now();
  if(diff<=0) return "In play — grades tonight";
  const mins=Math.floor(diff/60000);
  const d=Math.floor(mins/1440), hh=Math.floor((mins%1440)/60), mm=mins%60;
  if(d>0) return "Tips in "+d+"d "+hh+"h";
  if(hh>0) return "Tips in "+hh+"h "+String(mm).padStart(2,"0")+"m";
  return "Tips in "+mm+"m";
}
function tickCountdowns(){
  const els=document.querySelectorAll(".cd[data-tip]");
  for(const el of els){
    const txt=cdText(el.getAttribute("data-tip"));
    if(!txt) continue;
    el.textContent=txt;
    if(txt.indexOf("In play")===0&&el.classList) el.classList.add("inplay");
  }
}
let cdStarted=false;
function countdownStart(){
  if(cdStarted) return; cdStarted=true;
  tickCountdowns();
  if(typeof setInterval==="function") setInterval(tickCountdowns,30000);
}
function gameCard(s,g){
  const det=g.detail||{};
  const mu=(det.home&&det.away)?(det.home+" v "+det.away):(g.game||"");
  let h='<div class="gcard"><div class="mu">'+esc(mu)+'</div>'
    +'<div class="meta">'+esc(g.league||"")+((g.sport&&g.league)?" · ":"")+esc(g.sport||"")+'</div>';
  const kinds=[];

/* ---------- form strip: one block per graded slip, from results.king_records ---------- */
function formStripHTML(court){
  const graded=(S.slips||[]).filter(x=>x.status==="GRADED"&&x.results&&x.results.king_records&&x.results.king_records[court])
    .sort((a,b)=>a.number-b.number);
  if(!graded.length) return "";
  const last=graded.slice(-12);
  const blocks=last.map(x=>{
    const kr=x.results.king_records[court];
    const c=(typeof kr.pnl_m==="number"&&kr.pnl_m>0)?"w":((typeof kr.pnl_m==="number"&&kr.pnl_m<0)?"l":"z");
    return '<span class="fblock '+c+'" title="Slip #'+num(x.number)+' · '+rec(kr.wins,kr.losses)+' · '+m(kr.pnl_m)+'"></span>';
  }).join("");
  const l5=graded.slice(-5);
  let w=0,l=0,p=0;
  for(const x of l5){ const kr=x.results.king_records[court]; w+=kr.wins||0; l+=kr.losses||0; p+=(typeof kr.pnl_m==="number"?kr.pnl_m:0); }
  p=Math.round(p*100)/100;
  return '<div class="formlab">Form — one block per graded slip, oldest first</div>'
    +'<div class="formstrip">'+blocks+'</div>'
    +'<div class="mut" style="margin-top:6px">Last '+l5.length+' slips: <span class="num">'+w+'-'+l+'</span> · <span class="num '+cls(p)+'">'+m(p)+'</span> — green blocks are slips this king finished in profit.</div>';
}

/* ---------- 4. king vs king ---------- */
function compareHTML(){
  const rows=(S.kings||[]).map(k=>({court:k.court,f:fwdKing(k.court)||{},fit:k}));
  let h='<h2 class="sec">King vs king</h2><p class="sec-sub">Side by side, live record first.</p>'
    +'<table><thead><tr><th>King</th><th>Live record</th><th>Live P&amp;L</th><th>Live ROI</th><th>Fitted ROI</th></tr></thead><tbody>';
  for(const r of rows){
    h+='<tr><td data-l="King"><strong>'+esc(r.court)+'</strong></td>'
      +'<td data-l="Live record" class="num">'+rec(r.f.wins,r.f.losses)+'</td>'
      +'<td data-l="Live P&L" class="num '+cls(r.f.pnl_m)+'">'+m(r.f.pnl_m)+'</td>'
      +'<td data-l="Live ROI" class="num '+cls(r.f.roi_pct)+'">'+pct(r.f.roi_pct)+'</td>'
      +'<td data-l="Fitted ROI" class="num">'+pct(r.fit.roi_pct)+'</td></tr>';
  }
  h+='</tbody></table>';
  /* chart B: fitted ROI vs live ROI, paired bars on a zero line */
  let maxR=1;
  for(const r of rows){
    maxR=Math.max(maxR,Math.abs(typeof r.fit.roi_pct==="number"?r.fit.roi_pct:0),Math.abs(typeof r.f.roi_pct==="number"?r.f.roi_pct:0));
  }
  const roiRow=(lab,val,kind)=>{
    const v=typeof val==="number"?val:0;
    const w=Math.abs(v)/maxR*50;
    const style=v>=0?("left:50%;width:"+w+"%"):("left:"+(50-w)+"%;width:"+w+"%");
    return '<div class="roi-row"><span class="roi-lab">'+lab+'</span><div class="roi-track"><div class="roi-zero"></div><div class="roi-bar '+kind+'" style="'+style+'"></div></div><span class="roi-val num '+cls(v)+'">'+pct(val)+'</span></div>';
  };
  h+='<div class="card" style="margin-top:12px"><h3>Fitted ROI vs live ROI</h3>'
    +'<div class="legend"><span><span class="sw fit"></span>Fitted — the test games</span><span><span class="sw liv"></span>Live — real slips</span></div>'
    +'<p class="mut" style="margin:0 0 4px">Bars run from the middle zero line — right is profit, left is loss.</p>';
  for(const r of rows){
    h+='<div class="roi-block"><div class="roi-name">'+esc(r.court)+'</div>'
      +roiRow("Fitted",r.fit.roi_pct,"fit")
      +roiRow("Live",r.f.roi_pct,"liv")
      +'</div>';
  }
  h+='</div>';
  /* chart C: live wins vs losses, one stacked bar per king */
  h+='<div class="card"><h3>Live wins vs losses</h3>';
  for(const r of rows){
    const w=typeof r.f.wins==="number"?r.f.wins:0, l=typeof r.f.losses==="number"?r.f.losses:0;
    const tot=w+l, wp=tot?Math.round(w/tot*100):50;
    h+='<div class="bar-row"><div class="bar-lab"><span>'+esc(r.court)+'</span><span class="num">'+rec(r.f.wins,r.f.losses)+' · '+num(r.f.games)+' games</span></div>'
      +'<div class="stack-track"><div class="stack-w" style="width:'+wp+'%"></div><div class="stack-l"></div></div>'
      +'<div class="stack-lab"><span class="pos num">'+num(r.f.wins)+' won</span><span class="neg num">'+num(r.f.losses)+' lost</span></div></div>';
  }
  h+='<p class="mut" style="margin:6px 0 0">Green is wins, red is losses, split by the live record.</p></div>';
  return h;
}

      h+='<div class="row"><span class="k">'+esc(ln.court||"")+'</span><span class="v num">'+rec(ln.wins,ln.losses)+' · <span class="'+cls(ln.pnl_m)+'">'+m(ln.pnl_m)+'</span> · '+pct(ln.roi_pct)+'</span></div>';

    if(ex.control) h+='<div class="row"><span class="k">Control (coin-flip line)</span><span class="v num">'+rec(ex.control.wins,ex.control.losses)+' · <span class="'+cls(ex.control.pnl_m)+'">'+m(ex.control.pnl_m)+'</span> · '+pct(ex.control.roi_pct)+'</span></div>';
    h+='<p class="mut">Graded '+esc(ex.graded_on||"")+'</p>';
  }
  for(const a of agents){
    h+='<div class="item"><div class="t">'+esc(a.name||"")+' <span class="tag">'+esc(a.group||"")+'</span></div>'
      +'<div class="s">'+esc(a.role||"")+' · Runs '+esc(a.cadence||"")+'</div>'
      +'<div class="s">'+esc(a.headline||"")+'</div>'
      +'<div class="s">Last active: '+when(a.last_activity)+'</div></div>';
  }
  return h?detailsBlock("Research workforce & exam",h):"";
}
function integrityHTML(){
  const g=S.integrity||{};
  if(!g||!Object.keys(g).length) return "";
  let h='<div class="row"><span class="k">Audit run</span><span class="v num">#'+num(g.run)+' · '+when(g.last_run)+'</span></div>'
    +'<div class="row"><span class="k">Vault seal</span><span class="v">'+esc(g.vault_seal||"")+'</span></div>'
    +'<div class="row"><span class="k">Registry</span><span class="v">'+esc(g.registry||"")+'</span></div>'
    +'<div class="row"><span class="k">Receipts</span><span class="v">'+esc(g.receipts||"")+'</span></div>'
    +'<div class="row"><span class="k">Canary gates / fixtures</span><span class="v num">'+num(g.canary_gates)+' / '+num(g.canary_fixtures)+'</span></div>'
    +'<div class="row"><span class="k">Findings on record</span><span class="v num">'+num(g.findings_count)+'</span></div>';
  for(const f of (g.findings||[])){
    h+='<div class="item"><div class="s">'+esc(f.summary||"")+'</div></div>';
  }
  return detailsBlock("Integrity audit",h);
}
function proofHTML(){
  let h='<div class="item"><div class="t">The luck test (Romano-Wolf) — PASSED, both steps</div>'
    +'<div class="s">Checked 25 Nov 2026. The strict test asks: could the kings only look good because thousands of strategies were tried? Step 1 (the five kings on their own): all five passed at the strongest level the test can show — adjusted p &lt; 0.0001, and not one of 10,000 luck-shuffles beat any king. Step 2 (charged for the whole search — 10,579 strategies tried, 285 truly different): all five passed again, at the same level, under two test settings.</div>'
    +'<div class="s">The honest limits: this is the fitted record (practice on old games), not live slips. The bar they cleared — always back the favourite — is a weak one. And 285 is a floor: the big registry’s rows could not be turned into testable strategies, so the true search was wider and the correction is, if anything, generous to the kings. This crowns nothing.</div></div>'
    +'<div class="item"><div class="t">Beating the closing price — promising, NOT PROVEN</div>'
    +'<div class="s">Checked 25 Nov 2026, on 88 graded games (slips #39–#42). Picks whose price beat the closing price returned +6.3%; picks that did not returned −13.4%. All five kings show the same shape. But 88 games is too few — the honest range around that gap still includes zero. Verdict on record: NOT ENOUGH DATA. No betting gate uses this yet; the test re-runs after 4–6 more graded slips.</div></div>'
    +'<div class="proof-note"><strong>Forward board: corrected (25 Nov 2026).</strong> The recount landed. The old forward figures were made by re-running today\u2019s kings over old slips — grading kings on games played before they were crowned. Those figures are withdrawn. The board now counts only the picks that were actually locked at the time (the as-locked record), and on that true board no king is in forward profit.</div>';
  return detailsBlock("Proof — the strongest evidence",h);
}
function tuckedHTML(){
  const parts=[proofHTML(),workforceHTML(),stakehunterHTML(),autopsyHTML(),researchHTML(),integrityHTML()].filter(Boolean);
  if(!parts.length) return "";
  return '<h2 class="sec">Behind the scenes</h2><p class="sec-sub">The working machinery — tap to open any part.</p>'+parts.join("");
}

/* ---------- tabs ---------- */
function pane(name,inner){
  if(!inner) inner='<p class="mut" style="margin-top:24px">Nothing here yet.</p>';
  return '<section class="tabpane" data-pane="'+name+'"'+(name===activeTab?"":' style="display:none"')+'>'+inner+'</section>';
}
function applyTabs(){
  const panes=document.querySelectorAll(".tabpane");
  for(const p of panes){ p.style.display = p.getAttribute("data-pane")===activeTab ? "" : "none"; }
  const btns=document.querySelectorAll(".tabbtn");
  for(const b of btns){ b.setAttribute("aria-selected", b.getAttribute("data-tabbtn")===activeTab ? "true" : "false"); }
}
function showTab(name){
  activeTab=name;
  applyTabs();
  const tb=document.getElementById("tabbar");
  if(tb&&tb.scrollIntoView) tb.scrollIntoView();
}

/* ---------- render ---------- */
function render(){
  document.getElementById("updated").textContent="Updated "+when(S.generated_at);
  document.getElementById("banner-kings").innerHTML=bannerHTML();
  document.getElementById("ticker-track").innerHTML=tickerGroup()+tickerGroup();
  document.getElementById("content").innerHTML =
    pane("overview", todayHTML()+summaryHTML()+totalsHTML()+pnlChartHTML()+forwardHTML())
    +pane("kings", kingsHTML())
    +pane("compare", compareHTML())
    +pane("slips", slipsHTML())
    +pane("bets", betsHTML()+activityHTML())
    +pane("more", tuckedHTML());
  applyTabs();
  tickerStart();
  countdownStart();
}

/* ---------- loader: same contract as before — fetch status.json, re-check every 60s ---------- */
async function load(){
  try{
    const r = await fetch("status.json", {cache: "no-store"});
    if(!r.ok) throw new Error("HTTP " + r.status);
    S = await r.json();
    document.getElementById("fatal").innerHTML = "";
    render();
  }catch(err){
    if(!S) document.getElementById("fatal").innerHTML = '<div class="err">The desk could not load status.json (' + esc(err.message) + "). It will retry automatically.</div>";
  }
}
load();
setInterval(load, 60000);
</script>
