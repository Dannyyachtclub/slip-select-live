<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<title>Slip Select — Trade Desk</title>
<meta name="description" content="Slip Select live trade desk: forward record, the five kings, slips and called bets, agent activity and research.">
<style>
:root{
  --bg:#05070d; --bg2:#080a13; --surface:#0b0e19; --surface2:#101527; --inset:#070912;
  --line:#262c47; --line-soft:#1a1f36; --line-faint:#12162a;
  --ink:#f4efe3; --mut:#a7adc0; --dim:#6f7690;
  --gold:#c8a24a; --gold-hi:#eed188; --gold-deep:#6d531d;
  --pos:#43c98a; --neg:#e46565; --amb:#e0a44e; --cyan:#72c7dc; --vio:#a48fe0;
  --serif:Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.55;overflow-x:hidden}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.pos{color:var(--pos)} .neg{color:var(--neg)} .amb{color:var(--amb)}
.mut{color:var(--mut)} .dim{color:var(--dim)}
a{color:var(--gold-hi)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
h1,h2,h3{margin:0}
.lab{color:var(--dim);font-size:.66rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:rgba(5,7,13,.96);
  border-bottom:1px solid var(--line-soft)}
.topbar-in{display:flex;align-items:center;gap:12px;padding:9px 0}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{flex:0 0 auto;width:30px;height:30px;color:var(--gold)}
.brand-name{font-family:var(--serif);font-weight:700;font-size:1.02rem;letter-spacing:.22em;white-space:nowrap}
.brand-sub{font-size:.62rem;font-weight:700;letter-spacing:.3em;color:var(--gold);text-transform:uppercase}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.clock{font-size:.86rem;color:var(--mut)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--pos);display:inline-block}
.dot.stale{background:var(--amb)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border:1px solid var(--line);
  border-radius:999px;font-size:.72rem;font-weight:600;color:var(--mut);white-space:nowrap;background:var(--inset)}
.chip.gold{color:var(--gold-hi);border-color:rgba(200,162,74,.55)}
.chip.grn{color:var(--pos);border-color:rgba(67,201,138,.5)}
.chip.red{color:var(--neg);border-color:rgba(228,101,101,.5)}
.chip.amb{color:var(--amb);border-color:rgba(224,164,78,.5)}
.chip.cyan{color:var(--cyan);border-color:rgba(114,199,220,.5)}

/* ---------- status strip ---------- */
.strip{border-bottom:1px solid var(--line-soft);background:linear-gradient(180deg,var(--bg2),var(--bg))}
.strip-in{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;padding:10px 0}
.strip-in::-webkit-scrollbar{display:none}
.stat{flex:0 0 auto;padding:2px 16px 2px 0;margin-right:16px;border-right:1px solid var(--line-faint)}
.stat:last-child{border-right:0}
.stat .v{font-size:1.06rem;font-weight:700;line-height:1.25;white-space:nowrap}
.stat .l{font-size:.64rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.kingsrow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:0 0 12px}
.kingsrow::-webkit-scrollbar{display:none}
.kmini{flex:0 0 auto;display:flex;align-items:center;gap:9px;background:var(--surface);
  border:1px solid var(--line-soft);border-radius:10px;padding:7px 11px 7px 8px;min-width:172px}
.kmini img{width:34px;height:34px;border-radius:8px;object-fit:cover;border:1px solid var(--line)}
.kmini .kc{font-size:.68rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.kmini .kv{font-size:.86rem;font-weight:700}
.kmini .ks{font-size:.68rem;color:var(--dim)}

/* ---------- tabs ---------- */
.tabs{position:sticky;top:49px;z-index:49;background:rgba(5,7,13,.97);border-bottom:1px solid var(--line)}
.tabs-in{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs-in::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;padding:14px 14px;min-height:48px;display:flex;align-items:center;justify-content:center;font-size:.84rem;font-weight:700;letter-spacing:.06em;
  color:var(--mut);border-bottom:2px solid transparent;text-transform:uppercase;text-align:center}
.tab[aria-selected="true"]{color:var(--gold-hi);border-bottom-color:var(--gold)}
.tabpage{display:none;padding:22px 0 42px}
.tabpage.active{display:block}
.sec-title{font-size:1.24rem;font-weight:800;letter-spacing:.02em;margin:0 0 5px}
.sec-sub{color:var(--mut);font-size:.93rem;line-height:1.5;margin:0 0 16px}
.block{margin:0 0 22px}

/* ---------- cards & grids ---------- */
.grid{display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}
@media(min-width:760px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:759px){.grid{grid-template-columns:repeat(2,1fr)}.king-stats{grid-template-columns:repeat(2,1fr)!important}}
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;padding:16px}
.card .v{font-size:1.38rem;font-weight:800;line-height:1.2}
.card .l{font-size:.66rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);margin-top:2px}
.card .s{font-size:.78rem;color:var(--mut);margin-top:3px}
.panel{background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;padding:16px}
.panel h3{font-size:.92rem;font-weight:800;margin:0 0 8px}

/* ---------- tables ---------- */
.tscroll{overflow-x:auto;border:1px solid var(--line-soft);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.88rem;min-width:560px}
th{text-align:left;color:var(--dim);font-size:.64rem;font-weight:700;letter-spacing:.13em;
  text-transform:uppercase;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--inset)}
td{padding:10px 12px;border-bottom:1px solid var(--line-faint);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.res{font-weight:800;font-size:.72rem;letter-spacing:.08em}
.res.WON{color:var(--pos)} .res.LOST{color:var(--neg)} .res.PUSH,.res.VOID{color:var(--amb)}
.tag{display:inline-block;padding:1px 7px;border-radius:5px;border:1px solid var(--line);
  font-size:.66rem;font-weight:700;letter-spacing:.07em;color:var(--mut);white-space:nowrap}
.tag.gold{color:var(--gold-hi);border-color:rgba(200,162,74,.55)}
.tag.grn{color:var(--pos);border-color:rgba(67,201,138,.5)}
.tag.red{color:var(--neg);border-color:rgba(228,101,101,.5)}
.tag.amb{color:var(--amb);border-color:rgba(224,164,78,.5)}

/* ---------- slips ---------- */
.slip{background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;padding:16px;margin:0 0 14px}
.slip-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.slip-head .n{font-size:1rem;font-weight:800}
.slip-head .d{color:var(--mut);font-size:.8rem}
.slip-head .best{margin-left:auto;font-size:.78rem;color:var(--mut)}
.pickrows{display:grid;gap:6px;margin-top:10px}
@media(min-width:760px){.pickrows{grid-template-columns:1fr 1fr}}
.pickrow{display:flex;gap:8px;align-items:baseline;background:var(--inset);border:1px solid var(--line-faint);
  border-radius:8px;padding:7px 10px;font-size:.82rem}
.pickrow .k{flex:0 0 86px}
.pickrow .p{font-weight:600;overflow-wrap:anywhere}
.pickrow .o{margin-left:auto;text-align:right;white-space:nowrap}
.krec{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.krec .kr{background:var(--inset);border:1px solid var(--line-faint);border-radius:8px;padding:5px 9px;font-size:.74rem}
details.games{margin-top:10px}
details.games summary{cursor:pointer;color:var(--gold-hi);font-size:.8rem;font-weight:700;padding:4px 0}
details.games table{min-width:640px}

/* ---------- kings ---------- */
.king{background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;padding:16px;margin:0 0 14px;overflow:hidden}
.king-head{display:flex;gap:12px;align-items:center}
.king-head img{width:52px;height:52px;border-radius:10px;object-fit:cover;border:1px solid var(--line)}
.king-head .kc{font-size:.7rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.king-head .kn{font-weight:700;font-size:.86rem;overflow-wrap:anywhere}
.king-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
@media(min-width:760px){.king-stats{grid-template-columns:repeat(6,1fr)}}
.king-stats .cell{background:var(--inset);border:1px solid var(--line-faint);border-radius:8px;padding:8px 10px}
.king-stats .v{font-size:1rem;font-weight:800}
.king-stats .l{font-size:.6rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}

/* ---------- activity / research ---------- */
.feed{display:grid;gap:8px}
.evt{background:var(--surface);border:1px solid var(--line-soft);border-radius:10px;padding:13px 14px}
.evt .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.72rem;color:var(--dim)}
.evt .t{font-weight:700;font-size:.88rem;margin-top:3px;overflow-wrap:anywhere}
.evt .s{color:var(--mut);font-size:.82rem;margin-top:2px;overflow-wrap:anywhere}
.agent{display:flex;gap:10px;align-items:flex-start;background:var(--surface);
  border:1px solid var(--line-soft);border-radius:10px;padding:11px 13px}
.agent img{width:38px;height:38px;border-radius:8px;object-fit:cover;border:1px solid var(--line)}
.agent .an{font-weight:800;font-size:.88rem}
.agent .ar{color:var(--mut);font-size:.78rem}
.agent .ah{color:var(--dim);font-size:.78rem;margin-top:2px;overflow-wrap:anywhere}
.agent .when{margin-left:auto;text-align:right;font-size:.7rem;color:var(--dim);white-space:nowrap}
.finding{border-bottom:1px solid var(--line-faint);padding:9px 0}
.finding:last-child{border-bottom:0}
.finding .fh{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.finding .fn{font-weight:700;font-size:.86rem}
.finding .fv{color:var(--mut);font-size:.8rem;margin-top:2px}
.foot{border-top:1px solid var(--line-soft);padding:16px 0 26px;color:var(--dim);font-size:.76rem}
.empty{color:var(--dim);font-size:.86rem;padding:10px 0}
.err{background:#2a1215;border:1px solid rgba(228,101,101,.5);color:#f3c1c1;border-radius:10px;padding:12px 14px;font-size:.86rem}
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap topbar-in">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <path d="M24 5 L29 15 L24 12.4 L19 15 Z" fill="currentColor" opacity=".95"/>
        <path d="M10 12 L18.5 18.5 L14.8 19.4 L8.5 17 Z" fill="currentColor" opacity=".6"/>
        <path d="M38 12 L29.5 18.5 L33.2 19.4 L39.5 17 Z" fill="currentColor" opacity=".6"/>
        <path d="M24 12.5 C30 16 33 21 32.4 27.5 C32 32 29 36.5 24 43 C19 36.5 16 32 15.6 27.5 C15 21 18 16 24 12.5 Z" fill="currentColor" opacity=".88"/>
        <circle cx="20.6" cy="24.5" r="1.5" fill="#05070d"/><circle cx="27.4" cy="24.5" r="1.5" fill="#05070d"/>
      </svg>
      <div>
        <div class="brand-name">SLIP&nbsp;SELECT</div>
        <div class="brand-sub">Trade Desk</div>
      </div>
    </div>
    <div class="top-right">
      <span class="chip" id="live-chip"><span class="dot" id="live-dot"></span><span id="live-txt">Live</span></span>
      <span class="clock num" id="clock">—</span>
      <span class="chip gold" id="updated">Regina · loading…</span>
    </div>
  </div>
</header>

<div class="strip">
  <div class="wrap">
    <div class="strip-in" id="strip"><div class="glide-track" id="strip-track"></div></div>
    <div class="kingsrow" id="kingsrow"><div class="glide-track" id="kings-track"></div></div>
  </div>
</div>

<div class="wrap"><div id="stale-banner" class="stale-banner" hidden></div></div>

<nav class="tabs" aria-label="Desk sections">
  <div class="wrap tabs-in" id="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="overview" aria-selected="true">Overview</button>
    <button class="tab" role="tab" data-tab="slips" aria-selected="false">Slips &amp; Bets</button>
    <button class="tab" role="tab" data-tab="kings" aria-selected="false">Kings</button>
    <button class="tab" role="tab" data-tab="activity" aria-selected="false">Activity</button>
    <button class="tab" role="tab" data-tab="research" aria-selected="false">Research</button>
  </div>
</nav>

<main class="wrap">
  <section class="tabpage active" id="page-overview" role="tabpanel"></section>
  <section class="tabpage" id="page-slips" role="tabpanel"></section>
  <section class="tabpage" id="page-kings" role="tabpanel"></section>
  <section class="tabpage" id="page-activity" role="tabpanel"></section>
  <section class="tabpage" id="page-research" role="tabpanel"></section>
  <div id="fatal"></div>
  <footer class="foot" id="foot"></footer>
</main>

<script>
"use strict";
/* ============ Slip Select Trade Desk — renders entirely from status.json ============ */
const TZ = "America/Regina";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isNum = (v) => typeof v === "number" && isFinite(v);
const fmtM = (v, dp) => isNum(v) ? (v > 0 ? "+" : "") + v.toLocaleString("en-CA",{minimumFractionDigits:(dp==null?2:dp),maximumFractionDigits:(dp==null?2:dp)}) + "m" : "—";
const fmtPct = (v) => isNum(v) ? (v > 0 ? "+" : "") + v.toFixed(2) + "%" : "—";
const fmtPrice = (v) => isNum(v) ? (Math.round(v*1000)/1000).toString() : "—";
const cls = (v) => isNum(v) ? (v > 0 ? "pos" : v < 0 ? "neg" : "") : "";
const dFmt = new Intl.DateTimeFormat("en-CA",{timeZone:TZ,month:"short",day:"numeric"});
const tFmt = new Intl.DateTimeFormat("en-CA",{timeZone:TZ,hour:"numeric",minute:"2-digit",hour12:true});
const dtFmt = new Intl.DateTimeFormat("en-CA",{timeZone:TZ,month:"short",day:"numeric",hour:"numeric",minute:"2-digit",hour12:true});
const clockFmt = new Intl.DateTimeFormat("en-CA",{timeZone:TZ,hour:"numeric",minute:"2-digit",second:"2-digit",hour12:true});
function fmtDay(iso){ if(!iso) return "—"; const d = new Date(iso); return isNaN(d) ? "—" : dFmt.format(d); }
function fmtTime(iso){ if(!iso) return "—"; const d = new Date(iso); return isNaN(d) ? "—" : tFmt.format(d); }
function fmtDT(iso){ if(!iso) return "—"; const d = new Date(iso); return isNaN(d) ? "—" : dtFmt.format(d); }
function resChip(r){ return r ? '<span class="res ' + esc(r) + '">' + esc(r) + "</span>" : '<span class="dim">—</span>'; }
const COURT_IMG = {Legacy:"assets/legacy.jpg",Regime:"assets/regime.jpg",Quantum:"assets/quantum.jpg",Selector:"assets/selector.jpg",Vanguard:"assets/vanguard.jpg"};
const AGENT_IMG = {Legacy:"assets/legacy.jpg",Regime:"assets/regime.jpg",Quantum:"assets/quantum.jpg",Selector:"assets/selector.jpg",Vanguard:"assets/vanguard.jpg",Arena:"assets/arena.jpg",Discovery:"assets/discovery.jpg","Edge Finder":"assets/edgefinder.jpg","Loss Autopsy":"assets/autopsy.jpg",Stakehunter:"assets/stakehunter.jpg","Research Director":"assets/director.jpg",Vault:"assets/vault.jpg"};

let S = null;           /* status.json payload */
const REDUCED = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
let activeTab = "overview";

/* ---------- clock: one basis, America/Regina, labelled ---------- */
function tickClock(){
  $("clock").textContent = clockFmt.format(new Date()) + " Regina";
}
setInterval(tickClock, 1000); tickClock();

/* ---------- tabs ---------- */
$("tabs").addEventListener("click", (e) => {
  const b = e.target.closest(".tab"); if(!b) return;
  activeTab = b.dataset.tab;
  document.querySelectorAll(".tab").forEach((t) => t.setAttribute("aria-selected", t.dataset.tab === activeTab ? "true" : "false"));
  document.querySelectorAll(".tabpage").forEach((p) => p.classList.toggle("active", p.id === "page-" + activeTab));
  window.scrollTo({top:0});
});

/* ---------- status strip: forward record leads, kings follow ---------- */
function renderStrip(){
  const f = S.forward || {}, b = S.bankroll || {}, v = S.vault || {};
  const cb = f.chosen_bets || {}, cf = f.confidence || {};
  const cells = [];
  if (isNum(cb.wins)) cells.push({v: cb.wins + "-" + cb.losses, l: "Forward · Chosen bets", c: cls(cb.pnl_m), s: fmtM(cb.pnl_m)});
  if (isNum(cf.wins)) cells.push({v: cf.wins + "-" + cf.losses, l: "Forward · Confidence", c: cls(cf.pnl_m), s: fmtM(cf.pnl_m)});
  if (b.record) cells.push({v: b.record, l: "Called bets · Record", c: cls(b.settled_pnl_m), s: fmtM(b.settled_pnl_m)});
  if (isNum(b.winrate_pct)) cells.push({v: b.winrate_pct.toFixed(1) + "%", l: "Called bets · Win rate", c: "", s: ""});
  if (isNum(v.count)) cells.push({v: String(v.count), l: "Vault · Sealed games", c: "", s: v.next_opening ? "opens " + v.next_opening : ""});
  const grand = (S.kings || []).find((k) => k.grand_king);
  if (grand) cells.push({v: esc(grand.court), l: "Grand King", c: "", s: fmtPct(grand.roi_pct) + " practice"});
  const stripHTML = cells.map((c) =>
    '<div class="stat"><div class="v num ' + c.c + '">' + c.v + (c.s ? ' <span style="font-size:.8rem">' + c.s + "</span>" : "") + '</div><div class="l">' + c.l + "</div></div>"
  ).join("");
  $("strip-track").innerHTML = stripHTML + stripHTML;
  const kingsHTML = (S.kings || []).map((k) =>
    '<div class="kmini' + (isFreshCrown(k) ? " pulse-gold" : "") + '" data-king="' + esc(k.court) + '" role="button" tabindex="0" title="King detail">' +
      (COURT_IMG[k.court] ? '<img src="' + COURT_IMG[k.court] + '" alt="" loading="lazy">' : "") +
      '<div><div class="kc">' + esc(k.court) + (k.grand_king ? ' <span class="tag gold">\u2605 Grand</span>' : "") + (isFreshCrown(k) ? ' <span class="tag gold">\u2605 New crown</span>' : "") + "</div>" +
      '<div class="kv num">' + k.wins + "-" + k.losses + ' · <span class="' + cls(k.roi_pct) + '">' + fmtPct(k.roi_pct) + "</span></div>" +
      '<div class="ks">practice score · fitted</div></div></div>'
  ).join("");
  $("kings-track").innerHTML = kingsHTML + kingsHTML;
  setupGlides();
  const gen = S.generated_at ? new Date(S.generated_at) : null;
  $("updated").textContent = "Data as of " + (gen && !isNaN(gen) ? dtFmt.format(gen) : "—") + " Regina";
  const stale = gen && !isNaN(gen) && (Date.now() - gen.getTime() > 15 * 60 * 1000);
  $("live-dot").className = "dot" + (stale ? " stale" : "");
  $("live-txt").textContent = stale ? "Stale" : "Live";
  checkStale();
}

/* ---------- stale-data banner: judges the age of status.json itself ----------
   If the data file is more than ~10 minutes old when viewed, say so loudly.
   This judges the file's own generated_at stamp — never invented data. */
function checkStale(){
  const el = $("stale-banner");
  if(!el) return;
  if(!S || !S.generated_at){ el.hidden = true; return; }
  const gen = new Date(S.generated_at);
  const ageMin = (Date.now() - gen.getTime()) / 60000;
  if(!isNaN(ageMin) && ageMin > 10){
    el.hidden = false;
    el.innerHTML = "<strong>Stale data.</strong> These figures are as of " + dtFmt.format(gen) +
      " Regina (" + Math.round(ageMin) + " min old). The desk refreshes every 5 minutes — " +
      "if this banner persists, the refresh job needs attention.";
  } else {
    el.hidden = true;
  }
}
setInterval(checkStale, 30000);

/* =====================================================================
   COMPONENT SYSTEM — how this desk is built (read before adding widgets)
   - Every tab page is a list of WIDGETS: small functions (S) => htmlString,
     registered in the WIDGETS map below under their tab name.
   - To add a widget later: write one function, add it to the tab's array.
     No restructuring of the page, tabs or loader is needed.
   - Shared building blocks: statTile(), panel(), tableWrap(), tag(), and
     the modal (openModal/closeModal) for detail views.
   - Interactivity is delegated: clicks on [data-king], [data-bet],
     [data-slip-games] etc. are handled once, centrally, near the bottom.
   ===================================================================== */

/* ---------- extra component styles (injected so the base sheet stays lean) ---------- */
(function injectCSS(){
  const css = `
  .glide-track{display:flex;gap:inherit;width:max-content;will-change:transform}
  #kings-track{gap:0} #kings-track .kmini{margin-right:8px}
  #strip-track{gap:0}
  .strip-in,.kingsrow{overflow:hidden;cursor:grab;touch-action:pan-y}
  .strip-in .stat{flex:0 0 auto}

/* ---------- gliding strip: continuous slow glide, drag while touched, resumes on release ----------
   Standing user rule: the strip glides on its own, can be dragged while touched,
   and resumes sliding the moment the touch ends — never stays paused, no jump-cuts. */
const glides = [];
function makeGlide(viewportId, trackId){
  const vp = $(viewportId), track = $(trackId);
  if(!vp || !track) return null;
  const g = {vp, track, off: 0, dragging: false, lastX: 0, half: 0, raf: 0};
  const measure = () => { g.half = track.scrollWidth / 2; };
  const step = () => {
    if(!g.dragging && g.half > vp.clientWidth + 4){
      g.off -= 0.45;                                   /* ~27px/s at 60fps — slow glide */
      if(-g.off >= g.half) g.off += g.half;            /* seamless wrap, no jump-cut */
      track.style.transform = "translateX(" + g.off + "px)";
    }
    g.raf = requestAnimationFrame(step);
  };
  vp.addEventListener("pointerdown", (e) => { g.dragging = true; g.lastX = e.clientX; vp.setPointerCapture(e.pointerId); });
  vp.addEventListener("pointermove", (e) => {
    if(!g.dragging) return;
    const dx = e.clientX - g.lastX;
    g.off += dx; g.lastX = e.clientX; g.moved = (g.moved || 0) + Math.abs(dx);
    if(g.half > 0){ if(g.off > 0) g.off -= g.half; if(-g.off >= g.half) g.off += g.half; }
    track.style.transform = "translateX(" + g.off + "px)";
  });
  const end = () => { if(g.moved > 6) window.__lastDragEnd = Date.now(); g.moved = 0; g.dragging = false; };  /* release -> the loop resumes gliding */
  vp.addEventListener("pointerup", end); vp.addEventListener("pointercancel", end);
  measure(); step();
  g.remeasure = measure;
  return g;
}
let stripGlide = null, kingsGlide = null;
function setupGlides(){
  if(!stripGlide) stripGlide = makeGlide("strip", "strip-track");
  if(!kingsGlide) kingsGlide = makeGlide("kingsrow", "kings-track");
  requestAnimationFrame(() => { if(stripGlide) stripGlide.remeasure(); if(kingsGlide) kingsGlide.remeasure(); });
}

/* ---------- animated count-up: numbers animate to their real value, never change it ---------- */
const prevVals = {};
function countUp(el, key, target, fmt){
  if(!el || !isNum(target)) { if(el) el.textContent = fmt(target); return; }
  if(REDUCED){ prevVals[key] = target; el.textContent = fmt(target); return; }
  const from = isNum(prevVals[key]) ? prevVals[key] : 0;
  prevVals[key] = target;
  if(from === target){ el.textContent = fmt(target); return; }
  const t0 = performance.now(), dur = 650;
  const stepFn = (t) => {
    const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
    el.textContent = fmt(from + (target - from) * e);
    if(p < 1) requestAnimationFrame(stepFn); else el.textContent = fmt(target);
  };
  requestAnimationFrame(stepFn);
}
function runCountUps(scope){
  (scope || document).querySelectorAll("[data-cu]").forEach((el) => {
    const v = parseFloat(el.getAttribute("data-cu"));
    const kind = el.getAttribute("data-cufmt");
    const fmt = kind === "pct" ? fmtPct : kind === "pct1" ? ((x) => isNum(x) ? x.toFixed(1) + "%" : "—") : kind === "int" ? ((x) => isNum(x) ? String(Math.round(x)) : "—") : ((x) => fmtM(x));
    countUp(el, el.getAttribute("data-cukey"), v, fmt);
  });
}

/* ---------- notability: driven ONLY by real status.json data ---------- */
function reginaDay(iso){ if(!iso) return null; const d = new Date(iso); return isNaN(d) ? null : dFmt.format(d); }
function isFreshCrown(k){
  if(!k || !k.crowned_on || !S || !S.generated_at) return false;
  const gen = new Date(S.generated_at), cr = new Date(k.crowned_on + "T12:00:00-06:00");
  return !isNaN(gen) && !isNaN(cr) && (gen - cr) >= 0 && (gen - cr) < 36 * 3600 * 1000;
}
function liveBets(){ return (S.bets || []).filter((b) => b.status === "IN PLAY"); }
function openSlips(){ return (S.slips || []).filter((s) => s.status && s.status !== "GRADED"); }
function winStreak(){
  const led = ((S.bankroll || {}).ledger || []).slice();
  let n = 0;
  for(let i = led.length - 1; i >= 0; i--){ if(led[i].result === "WON") n++; else if(led[i].result === "LOST") break; }
  return n;
}
function bestForwardCourt(){
  const acc = forwardKingLines();
  let best = null, bestPnl = null;
  Object.keys(acc).forEach((c) => { if (bestPnl === null || acc[c].pnl_m > bestPnl){ best = c; bestPnl = acc[c].pnl_m; } });
  return bestPnl !== null && bestPnl > 0 ? best : null;
}
function forwardKingLines(){
  /* forward per-king lines: summed from the per-slip king records status.json carries */
  const acc = {};
  (S.slips || []).forEach((sl) => {
    const kr = (sl.results || {}).king_records || {};
    Object.keys(kr).forEach((court) => {
      acc[court] = acc[court] || {wins: 0, losses: 0, pnl_m: 0};
      acc[court].wins += kr[court].wins || 0; acc[court].losses += kr[court].losses || 0; acc[court].pnl_m += kr[court].pnl_m || 0;
    });
  });
  return acc;
}

/* ================= v3: liveness, workforce, charts, truth =================
   Liveness is DERIVED at view time from each agent's own timestamps:
   Live = last activity within 1x its cadence, Quiet = within 2x,
   Stale = beyond. Nothing here renders a status from a static list. */
function liveness(lastIso, cadenceMin){
  if(!lastIso) return {key: "none", label: "No report"};
  const t = new Date(lastIso).getTime();
  if(isNaN(t)) return {key: "none", label: "No report"};
  const ageMin = (Date.now() - t) / 60000;
  if(!isNum(cadenceMin)){
    return ageMin <= 120 ? {key: "live", label: "Live"} : {key: "stale", label: "Stale"};
  }
  if(ageMin <= cadenceMin) return {key: "live", label: "Live"};
  if(ageMin <= 2 * cadenceMin) return {key: "quiet", label: "Quiet"};
  return {key: "stale", label: "Stale"};
}
function srcLine(text){
  return '<p class="src-line">' + text + " · Data as of " +
    (S.generated_at ? fmtDT(S.generated_at) : "—") + " Regina.</p>";
}
function researchAgents(){ return ((S.research || {}).agents) || []; }
function liveCount(agents){
  return agents.filter((a) => liveness(a.last_activity, a.cadence_minutes).key === "live").length;
}

function wKingChart(){

  const data = kings.map((k) => {
    const a = acc[k.court];
    const decided = a ? (a.wins + a.losses) : 0;
    return {court: k.court, practice: k.roi_pct,
            forward: (a && decided > 0) ? (a.pnl_m / (25 * decided)) * 100 : null};
  });
  let maxAbs = 10;
  data.forEach((d) => { maxAbs = Math.max(maxAbs, Math.abs(d.practice || 0), Math.abs(d.forward || 0)); });
  const W = 360, plotX0 = 64, plotW = 292, zeroX = plotX0 + plotW / 2, scale = (plotW / 2) / maxAbs;
  const top = 30, blockH = 54, H = top + data.length * blockH + 8;

function wSlipChart(){
  const slips = (S.slips || []).slice().sort((a, b) => a.number - b.number)
    .map((sl) => {
      const pnls = (sl.top3 || []).map((t) => t.pnl_m).filter(isNum);
      return pnls.length ? {n: sl.number, v: pnls.reduce((x, y) => x + y, 0)} : null;
    }).filter(Boolean);
  if(!slips.length) return "";
  let maxV = 10, minV = -10;
  slips.forEach((s) => { maxV = Math.max(maxV, s.v); minV = Math.min(minV, s.v); });
  const W = 360, plotTop = 28, plotBot = 156, plotX0 = 30, plotX1 = 356;
  const zeroY = plotTop + (maxV / (maxV - minV)) * (plotBot - plotTop);
  const slot = (plotX1 - plotX0) / slips.length, barW = Math.min(36, slot * 0.6);
  let svg = '<svg class="chart-svg" viewBox="0 0 ' + W + ' 192" role="img" aria-label="Card profit and loss by slip">' +
    '<line x1="' + plotX0 + '" y1="' + zeroY.toFixed(1) + '" x2="' + plotX1 + '" y2="' + zeroY.toFixed(1) + '" stroke="var(--line)"/>';
  slips.forEach((s, i) => {

    const y = s.v >= 0 ? zeroY - hgt : zeroY;
    const fill = s.v >= 0 ? "#43c98a" : "#e46565";
    svg += '<rect x="' + (cx - barW / 2).toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + barW + '" height="' + Math.max(1, hgt).toFixed(1) + '" rx="4" fill="' + fill + '"/>' +

/* ================= fireworks — ONLY on real celebratory data in status.json =================
   Fires at most once per page load when at least one is true:
   (a) a king was crowned within the fresh-crown window (isFreshCrown),
   (b) the called-bet ledger win streak is >= 3,
   (c) the latest slip's grand pick WON.
   Never on losses or neutral data. Skipped under prefers-reduced-motion. */
let celebrated = false;
function celebrateReason(){
  const fresh = (S.kings || []).filter(isFreshCrown);
  if (fresh.length) return "\u2605 New crown \u2014 " + fresh[0].court;
  const streak = winStreak();
  if (streak >= 3) return "\u2605 Win streak \u2014 W" + streak + " on called bets";
  const slips = (S.slips || []).slice().sort((a, b) => b.number - a.number);
  if (slips.length && ((slips[0].results || {}).grand_pick || {}).result === "WON")
    return "\u2605 Latest slip #" + slips[0].number + " \u2014 grand pick won";
  return null;
}
function maybeCelebrate(){
  if (celebrated || REDUCED || !S) return;
  const reason = celebrateReason();
  if (!reason) return;
  celebrated = true;
  const veil = document.createElement("div");
  veil.className = "fw-veil";
  veil.setAttribute("role", "button");
  veil.setAttribute("aria-label", "Dismiss celebration");
  veil.innerHTML = '<canvas></canvas><div class="fw-hint">' + esc(reason) + " \u00b7 tap to dismiss</div>";
  document.body.appendChild(veil);
  const cv = veil.querySelector("canvas"), ctx = cv.getContext("2d");
  cv.width = window.innerWidth; cv.height = window.innerHeight;
  const cols = ["#eed188", "#c8a24a", "#43c98a", "#72c7dc", "#a48fe0"];
  const parts = [];
  const bursts = 5;
  for (let bIdx = 0; bIdx < bursts; bIdx++){
    const bx = cv.width * (0.18 + 0.64 * (bursts === 1 ? 0.5 : bIdx / (bursts - 1))) + (Math.random() * 30 - 15);
    const by = cv.height * (0.22 + Math.random() * 0.18);
    const col = cols[bIdx % cols.length];
    for (let i = 0; i < 42; i++){
      const a = Math.random() * Math.PI * 2, sp = 1.6 + Math.random() * 4.4;
      parts.push({x: bx, y: by, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1.2, life: 1, decay: 0.008 + Math.random() * 0.01, col: col, r: 1.4 + Math.random() * 1.8, delay: bIdx * 9});
    }
  }
  const t0 = performance.now();
  let raf = 0;
  const dismiss = () => { cancelAnimationFrame(raf); veil.remove(); };
  veil.addEventListener("click", dismiss);
  const frame = (t) => {
    const el = t - t0;
    ctx.clearRect(0, 0, cv.width, cv.height);
    let alive = false;
    parts.forEach((pt) => {
      if (el / 16.7 < pt.delay) { alive = true; return; }
      if (pt.life <= 0) return;
      alive = true;
      pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.045; pt.vx *= 0.985; pt.vy *= 0.99; pt.life -= pt.decay;
      ctx.globalAlpha = Math.max(0, pt.life);
      ctx.fillStyle = pt.col;
      ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2); ctx.fill();
    });
    ctx.globalAlpha = 1;
    if (alive && el < 2100) raf = requestAnimationFrame(frame); else dismiss();
  };
  raf = requestAnimationFrame(frame);
  setTimeout(dismiss, 2400);
}

      return '<div class="kv-row"><span class="k">Slip #' + sl.number + " · " + esc(sl.date || "") + '</span><span class="v num">' +
        r.wins + "-" + r.losses + ' · <span class="' + cls(r.pnl_m) + '">' + fmtM(r.pnl_m) + "</span></span></div>"; }).join("");
  if(hist) body += '<h3 style="margin:14px 0 6px;font-size:.9rem">Per-slip forward history</h3><div class="kv-rows">' + hist + "</div>";
  openModal(k.court + (k.grand_king ? " — Grand King" : ""), "Tap outside or ✕ to close", body);
}
function betModal(idx){
  const b = (S.bets || [])[idx];
  if(!b) return;
  openModal(b.pick || "Bet detail", "Slip #" + b.slip + " · " + (b.kind || ""), kvRows([
    ["Game", esc(b.game || "—")],
    ["Pick", esc(b.pick || "—")],
    ["Kind", esc(b.kind || "—") + (b.paper ? " · paper" : "")],
    ["Price", fmtPrice(b.price)],
    ["Stake", isNum(b.stake_m) ? b.stake_m + "m" : "—"],
    ["Status", esc(b.status || "—")],
    ["Result", b.result ? esc(b.result) : "—"],
    ["Final score", esc(b.final_score || "—")],
    ["P&amp;L", fmtM(b.pnl_m)],
    ["Tip (Regina)", fmtDT(b.tip_at)]
  ]));
}

/* ---------- central event delegation ---------- */
document.addEventListener("click", (e) => {
  if(window.__lastDragEnd && Date.now() - window.__lastDragEnd < 250 && e.target.closest(".glide-track")) return;  /* a drag is not a tap */
  const kEl = e.target.closest("[data-king]");
  if(kEl){ kingModal(kEl.getAttribute("data-king")); return; }
  const bEl = e.target.closest("[data-bet]");
  if(bEl){ betModal(parseInt(bEl.getAttribute("data-bet"), 10)); return; }
  const segEl = e.target.closest("[data-seg-tab]");
  if(segEl){
    const tab = segEl.getAttribute("data-seg-tab");
    pageView[tab] = segEl.getAttribute("data-seg-val");
    $("page-" + tab).innerHTML = PAGE_RENDER[tab]();
    if(tab === "research") runCountUps($("page-research"));
    return;
  }
  const aEl = e.target.closest("[data-act-agent]");
  if(aEl){ actFilter.agent = aEl.getAttribute("data-act-agent"); $("page-activity").innerHTML = WIDGETS.activity.map((w) => w()).join(""); return; }
  const wfEl = e.target.closest("[data-wf-group]");
  if(wfEl){ wfFilter.group = wfEl.getAttribute("data-wf-group"); $("page-research").innerHTML = renderResearchPage(); runCountUps($("page-research")); return; }
  const goEl = e.target.closest("[data-goto]");
  if(goEl){ const t = document.querySelector('.tab[data-tab="' + goEl.getAttribute("data-goto") + '"]'); if(t) t.click(); return; }
  const sEl = e.target.closest("[data-sh]");
  if(sEl){ shFilter.status = sEl.getAttribute("data-sh"); $("page-research").innerHTML = renderResearchPage(); runCountUps($("page-research")); return; }
});
document.addEventListener("change", (e) => {
  if(e.target.id === "f-slip"){ betFilter.slip = e.target.value; }
  else if(e.target.id === "f-result"){ betFilter.result = e.target.value; }
  else if(e.target.id === "f-kind"){ betFilter.kind = e.target.value; }
  else return;
  $("page-slips").innerHTML = renderSlipsPage();
});
document.addEventListener("keydown", (e) => {
  if(e.key !== "Enter" && e.key !== " ") return;
  const kEl = e.target.closest ? e.target.closest("[data-king]") : null;
  if(kEl){ e.preventDefault(); kingModal(kEl.getAttribute("data-king")); }
});

/* ---------- loader: same contract as before — fetch status.json, re-check every 60s ---------- */
async function load(){
  try{
    const r = await fetch("status.json", {cache: "no-store"});
    if(!r.ok) throw new Error("status " + r.status);
    S = await r.json();
    $("fatal").innerHTML = "";
    renderAll();
  }catch(err){
    if(!S) $("fatal").innerHTML = '<div class="err">The desk could not load status.json (' + esc(err.message) + "). It will retry automatically.</div>";
  }
}
load();
setInterval(load, 60000);
</script>
