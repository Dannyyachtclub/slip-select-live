<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slip Select — Live Desk</title>
<style>
:root{
  --bg:#05070d; --bg2:#080a13; --surface:#0b0e19; --surface2:#101527; --inset:#070912;
  --line:#262c47; --line-soft:#1a1f36; --line-faint:#12162a;
  --ink:#f4efe3; --mut:#a7adc0; --dim:#6f7690;
  --gold:#c8a24a; --gold-hi:#eed188;
  --pos:#43c98a; --neg:#e46565; --amb:#e0a44e; --cyan:#72c7dc; --vio:#a48fe0;
  --serif:Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.55}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.pos{color:var(--pos)} .neg{color:var(--neg)} .amb{color:var(--amb)}
.mut{color:var(--mut)} .dim{color:var(--dim)}
a{color:var(--gold-hi)}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 48px}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:rgba(5,7,13,.97);
  border-bottom:1px solid var(--line-soft);padding:12px 14px}
.topbar-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand-name{font-family:var(--serif);font-weight:700;font-size:1.15rem;letter-spacing:.18em}
.brand-sub{font-size:.68rem;font-weight:700;letter-spacing:.28em;color:var(--gold);text-transform:uppercase}
.dot{width:9px;height:9px;border-radius:50%;background:var(--pos);display:inline-block;flex:0 0 auto}
.updated{margin-left:auto;font-size:.85rem;color:var(--mut)}

/* ---------- headings ---------- */
h2.sec{font-size:1.35rem;line-height:1.25;margin:34px 0 4px;font-weight:800}
.sec-sub{color:var(--mut);font-size:.98rem;margin:0 0 14px}
h3{font-size:1.08rem;margin:0 0 6px}

/* ---------- big stat cards ---------- */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
@media(min-width:620px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;padding:14px}
.stat .l{font-size:.78rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.stat .v{font-size:1.55rem;font-weight:800;line-height:1.2;margin-top:2px}
.stat .s{font-size:.88rem;color:var(--mut)}

/* ---------- generic cards ---------- */
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;padding:16px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid var(--line-faint)}
.row:last-child{border-bottom:0}
.row .k{color:var(--mut)}
.row .v{font-weight:700;text-align:right}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.8rem;font-weight:800;
  letter-spacing:.06em;background:rgba(200,162,74,.16);color:var(--gold-hi);border:1px solid rgba(200,162,74,.6)}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;border:1px solid var(--line);
  font-size:.78rem;font-weight:700;color:var(--mut)}
.res-WON{color:var(--pos);font-weight:800}.res-LOST{color:var(--neg);font-weight:800}
.res-PUSH,.res-VOID{color:var(--amb);font-weight:800}

/* ---------- king cards ---------- */
.king{padding:0;overflow:hidden}
.king-head{display:flex;gap:14px;align-items:center;padding:16px 16px 10px}
.king-head img{width:64px;height:64px;border-radius:10px;object-fit:cover;border:1px solid var(--line);flex:0 0 auto}
.king-name{font-size:1.6rem;font-weight:900;line-height:1.1}
.king-sub{color:var(--mut);font-size:.92rem;margin-top:2px}
.king-body{padding:0 16px 16px}
.linebox{background:var(--inset);border:1px solid var(--line-faint);border-radius:10px;padding:12px 14px;margin-top:10px}
.linebox .t{font-size:.8rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.linebox .big{font-size:1.25rem;font-weight:800;margin-top:2px}
.linebox.live{border-color:rgba(67,201,138,.35)}
.rulename{font-size:.8rem;color:var(--dim);word-break:break-word;margin-top:10px}

/* ---------- comparison table + bars ---------- */
table{width:100%;border-collapse:collapse;background:var(--surface);
  border:1px solid var(--line-soft);border-radius:12px;overflow:hidden}
th{text-align:left;color:var(--dim);font-size:.78rem;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;padding:12px;border-bottom:1px solid var(--line);background:var(--inset)}
td{padding:12px;border-bottom:1px solid var(--line-faint);font-size:1rem;vertical-align:top}
tr:last-child td{border-bottom:0}
@media(max-width:560px){
  table,thead,tbody,tr,td{display:block;width:100%}
  thead{display:none}
  tr{border-bottom:1px solid var(--line);padding:8px 0}
  tr:last-child{border-bottom:0}
  td{border-bottom:0;padding:5px 14px}
  td::before{content:attr(data-l);display:block;font-size:.75rem;font-weight:700;
    letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
}
.bar-row{margin:12px 0}
.bar-lab{display:flex;justify-content:space-between;gap:10px;font-weight:700;margin-bottom:4px}
.bar-track{background:var(--inset);border:1px solid var(--line-faint);border-radius:6px;height:22px;overflow:hidden}
.bar-fill{height:100%}
.bar-fill.p{background:var(--pos)} .bar-fill.n{background:var(--neg)}

/* ---------- lists ---------- */
.item{padding:10px 0;border-bottom:1px solid var(--line-faint)}
.item:last-child{border-bottom:0}
.item .t{font-weight:700}
.item .s{color:var(--mut);font-size:.93rem}

/* ---------- tucked sections ---------- */
details{background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;margin-bottom:12px}
details summary{cursor:pointer;min-height:44px;display:flex;align-items:center;gap:8px;
  padding:12px 16px;font-weight:800;font-size:1.05rem;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";margin-left:auto;color:var(--gold-hi);font-size:1.3rem}
details[open ] summary::after{content:"\2212"}
details .inner{padding:0 16px 16px}
.err{background:rgba(228,101,101,.12);border:1px solid rgba(228,101,101,.5);border-radius:12px;
  padding:16px;color:var(--ink)}
footer{color:var(--dim);font-size:.88rem;margin-top:36px;text-align:center}
</style>
</head>
<body>
<header class="topbar"><div class="topbar-in">
  <div><div class="brand-name">SLIP SELECT</div><div class="brand-sub">Live Desk</div></div>
  <span class="dot" id="dot"></span>
  <div class="updated" id="updated">Loading…</div>
</div></header>

<main class="wrap" id="app">
  <div id="fatal"></div>
  <div id="content"><p class="mut">Loading the desk…</p></div>
  <footer>Slip Select — every number on this page comes straight from the programme's own record.</footer>
</main>

<script>
/* ============ Slip Select Live Desk — renders entirely from status.json ============ */
const COURT_IMG = {Legacy:"assets/legacy.jpg",Regime:"assets/regime.jpg",Quantum:"assets/quantum.jpg",Selector:"assets/selector.jpg",Vanguard:"assets/vanguard.jpg"};
const AGENT_IMG = {Legacy:"assets/legacy.jpg",Regime:"assets/regime.jpg",Quantum:"assets/quantum.jpg",Selector:"assets/selector.jpg",Vanguard:"assets/vanguard.jpg",Arena:"assets/arena.jpg",Discovery:"assets/discovery.jpg","Edge Finder":"assets/edgefinder.jpg","Loss Autopsy":"assets/autopsy.jpg",Stakehunter:"assets/stakehunter.jpg","Research Director":"assets/director.jpg",Vault:"assets/vault.jpg"};
let S = null;

function esc(x){return String(x==null?"":x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function num(x){return x==null?"—":String(x);}
function m(x){return x==null?"—":String(x)+"m";}
function pct(x){return x==null?"—":String(x)+"%";}
function cls(x){return (typeof x==="number"&&x<0)?"neg":(typeof x==="number"&&x>0)?"pos":"";}
function rec(w,l){return num(w)+"-"+num(l);}
function when(ts){
  if(!ts) return "—";
  const d=new Date(ts);
  return isNaN(d)?esc(ts):d.toLocaleString("en-CA",{timeZone:"America/Regina",dateStyle:"medium",timeStyle:"short"});
}

/* ---------- 1. top summary: settled P&L only ---------- */
function summaryHTML(){
  const b=S.bankroll||{};
  return '<div class="stats">'
    +'<div class="stat"><div class="l">Settled profit / loss</div><div class="v num '+cls(b.settled_pnl_m)+'">'+m(b.settled_pnl_m)+'</div><div class="s">Since '+esc(b.tracking_since||"")+'</div></div>'
    +'<div class="stat"><div class="l">Record</div><div class="v num">'+esc(b.record||rec(b.wins,b.losses))+'</div><div class="s">Win rate '+pct(b.winrate_pct)+'</div></div>'
    +'<div class="stat"><div class="l">Staked</div><div class="v num">'+m(b.settled_staked_m)+'</div><div class="s">Settled bets only</div></div>'
    +'<div class="stat"><div class="l">Return (ROI)</div><div class="v num '+cls(b.roi_pct)+'">'+pct(b.roi_pct)+'</div><div class="s">On settled stakes</div></div>'
    +'</div>';
}

/* ---------- 2. game totals up front ---------- */
function totalsHTML(){
  const f=S.forward||{}, v=S.vault||{};
  const slipsCount=Array.isArray(f.slips)?f.slips.length:"—";
  const pending=Array.isArray(f.pending_slips)&&f.pending_slips.length?("Slip #"+f.pending_slips.map(esc).join(", #")):"None";
  return '<h2 class="sec">The totals</h2><p class="sec-sub">How much real testing has been done so far.</p>'
    +'<div class="stats">'
    +'<div class="stat"><div class="l">Live games graded</div><div class="v num">'+num(f.games)+'</div><div class="s">Real slips, real results</div></div>'
    +'<div class="stat"><div class="l">Games in the vault</div><div class="v num">'+num(v.count)+'</div><div class="s">Next opening '+esc(v.next_opening||"")+'</div></div>'
    +'<div class="stat"><div class="l">Slips graded</div><div class="v num">'+slipsCount+'</div><div class="s">In the live record</div></div>'
    +'<div class="stat"><div class="l">Waiting to grade</div><div class="v num" style="font-size:1.15rem;padding-top:6px">'+pending+'</div><div class="s">Pending slips</div></div>'
    +'</div>';
}

/* ---------- 3. the five kings ---------- */
function fwdKing(court){
  const ks=(S.forward&&S.forward.kings)||[];
  for(const k of ks){ if(k.court===court) return k; }
  return null;
}
function kingCard(k){
  const f=fwdKing(k.court)||{};
  const d=k.dog_line||{};
  return '<div class="card king">'
    +'<div class="king-head"><img src="'+esc(COURT_IMG[k.court]||"")+'" alt="">'
    +'<div><div class="king-name">'+esc(k.court)+(k.grand_king?' <span class="badge">GRAND KING</span>':"")+'</div>'
    +'<div class="king-sub">Crowned '+esc(k.crowned_on||"")+' · Stamp: '+esc(k.stamp||"")+'</div></div></div>'
    +'<div class="king-body">'
    +'<div class="linebox live"><div class="t">Live — real slips since</div>'
    +'<div class="big num">'+rec(f.wins,f.losses)+' &nbsp;<span class="'+cls(f.pnl_m)+'">'+m(f.pnl_m)+'</span> &nbsp;<span class="'+cls(f.roi_pct)+'">'+pct(f.roi_pct)+'</span></div>'
    +'<div class="mut">'+num(f.games)+' games · '+num(f.priced)+' priced</div></div>'
    +'<div class="linebox"><div class="t">Fitted — the '+num(k.set_size)+' test games</div>'
    +'<div class="big num">'+rec(k.wins,k.losses)+' &nbsp;<span class="'+cls(k.pnl_m)+'">'+m(k.pnl_m)+'</span> &nbsp;<span class="'+cls(k.roi_pct)+'">'+pct(k.roi_pct)+'</span></div>'
    +'<div class="mut">'+num(k.priced)+' priced</div></div>'
    +'<div class="row"><span class="k">Underdog line (fitted)</span><span class="v num">'+rec(d.wins,d.losses)+' · <span class="'+cls(d.pnl_m)+'">'+m(d.pnl_m)+'</span> · '+pct(d.roi_pct)+'</span></div>'
    +'<div class="rulename">Rule: '+esc(k.name||"")+'</div>'
    +'</div></div>';
}
function kingsHTML(){
  return '<h2 class="sec">The five kings</h2>'
    +'<p class="sec-sub">Each king has two lines. <strong>Live</strong> is real slips and real results — that is the line that counts. <strong>Fitted</strong> is practice on old test games.</p>'
    +(S.kings||[]).map(kingCard).join("");
}

/* ---------- 4. king vs king ---------- */
function compareHTML(){
  const rows=(S.kings||[]).map(k=>({court:k.court,f:fwdKing(k.court)||{},fit:k}));
  let h='<h2 class="sec">King vs king</h2><p class="sec-sub">Side by side, live record first.</p>'
    +'<table><thead><tr><th>King</th><th>Live record</th><th>Live P&amp;L</th><th>Live ROI</th><th>Fitted ROI</th></tr></thead><tbody>';
  for(const r of rows){
    h+='<tr><td data-l="King"><strong>'+esc(r.court)+'</strong></td>'
      +'<td data-l="Live record" class="num">'+rec(r.f.wins,r.f.losses)+'</td>'
      +'<td data-l="Live P&L" class="num '+cls(r.f.pnl_m)+'">'+m(r.f.pnl_m)+'</td>'
      +'<td data-l="Live ROI" class="num '+cls(r.f.roi_pct)+'">'+pct(r.f.roi_pct)+'</td>'
      +'<td data-l="Fitted ROI" class="num">'+pct(r.fit.roi_pct)+'</td></tr>';
  }
  h+='</tbody></table>';
  const vals=rows.map(r=>Math.abs(typeof r.f.pnl_m==="number"?r.f.pnl_m:0));
  const max=Math.max.apply(null,vals.concat([1]));
  h+='<div class="card" style="margin-top:12px"><h3>Live profit / loss per king</h3>';
  for(const r of rows){
    const v=typeof r.f.pnl_m==="number"?r.f.pnl_m:0;
    const w=Math.round(Math.abs(v)/max*100);
    h+='<div class="bar-row"><div class="bar-lab"><span>'+esc(r.court)+'</span><span class="num '+cls(v)+'">'+m(r.f.pnl_m)+'</span></div>'
      +'<div class="bar-track"><div class="bar-fill '+(v<0?"n":"p")+'" style="width:'+w+'%"></div></div></div>';
  }
  h+='<p class="mut" style="margin:6px 0 0">Simple bars — longer means a bigger live profit or loss.</p></div>';
  return h;
}

/* ---------- 5a. forward record summary ---------- */
function deskRow(label,d){
  d=d||{};
  return '<div class="row"><span class="k">'+label+'</span><span class="v num">'+rec(d.wins,d.losses)+' · <span class="'+cls(d.pnl_m)+'">'+m(d.pnl_m)+'</span></span></div>';
}
function forwardHTML(){
  const f=S.forward||{};
  return '<h2 class="sec">The live record, by desk</h2><p class="sec-sub">The special bets, tracked apart from the kings.</p>'
    +'<div class="card">'
    +deskRow("Chosen bets",f.chosen_bets)
    +deskRow("Confidence bets",f.confidence)
    +deskRow("Underdog desk (paper)",f.underdog_desk)
    +deskRow("Draw desk (paper)",f.draw_desk)
    +'</div>';
}

/* ---------- 5b. slips ---------- */
function pickLine(label,p,res){
  if(!p) return "";
  let h='<div class="row"><span class="k">'+label+'</span><span class="v">'+esc(p.selection||"");
  if(p.price!=null) h+=' <span class="num">@ '+num(p.price)+'</span>';
  if(res&&res.result) h+=' — <span class="res-'+esc(res.result)+'">'+esc(res.result)+'</span>';
  if(res&&res.pnl_m!=null) h+=' <span class="num '+cls(res.pnl_m)+'">('+m(res.pnl_m)+')</span>';
  return h+'</span></div>';
}
function slipCard(s){
  const r=s.results||{};
  let h='<div class="card"><h3>Slip #'+num(s.number)+' <span class="tag">'+esc(s.status||"")+'</span></h3>'
    +'<div class="mut">'+esc(s.date||"")+' · '+num(s.games)+' games</div>'
    +pickLine("Grand pick",s.grand_pick,r.grand_pick)
    +pickLine("Confidence bet",s.confidence_bet,r.confidence_bet)
    +pickLine("Underdog desk (paper)",s.underdog_desk,r.underdog_desk)
    +pickLine("Draw desk (paper)",s.draw_desk,r.draw_desk);
  if(r.best_king) h+='<div class="row"><span class="k">Best king on this slip</span><span class="v">'+esc(r.best_king)+'</span></div>';
  if(r.king_records){
    h+='<div style="margin-top:8px">';
    for(const court of Object.keys(r.king_records)){
      const kr=r.king_records[court];
      h+='<div class="row"><span class="k">'+esc(court)+'</span><span class="v num">'+rec(kr.wins,kr.losses)+' · <span class="'+cls(kr.pnl_m)+'">'+m(kr.pnl_m)+'</span></span></div>';
    }
    h+='</div>';
  }
  return h+'</div>';
}
function slipsHTML(){
  const slips=(S.slips||[]).slice().reverse();
  if(!slips.length) return "";
  let h='<h2 class="sec">Latest slip</h2>'+slipCard(slips[0]);
  h+='<h2 class="sec">All slips</h2>'+slips.map(slipCard).join("");
  return h;
}

/* ---------- 5c. called bets ---------- */
function betsHTML(){
  const bets=S.bets||[];
  if(!bets.length) return "";
  let h='<h2 class="sec">Called bets</h2><p class="sec-sub">Every called bet on the recent slips, newest slip first.</p><div class="card">';
  const sorted=bets.slice().sort((a,b)=>(b.slip-a.slip));
  for(const b of sorted){
    h+='<div class="item"><div class="t">'+esc(b.pick||"")+' <span class="num mut">@ '+num(b.price)+'</span></div>'
      +'<div class="s">Slip #'+num(b.slip)+' · '+esc(b.game||"")+'</div>'
      +'<div class="s"><span class="tag">'+esc(b.kind||"")+'</span> '
      +(b.paper?' <span class="tag">PAPER</span>':"")
      +' Stake <span class="num">'+m(b.stake_m)+'</span>'
      +(b.result?' · <span class="res-'+esc(b.result)+'">'+esc(b.result)+'</span>':' · '+esc(b.status||""))
      +(b.pnl_m!=null?' · <span class="num '+cls(b.pnl_m)+'">'+m(b.pnl_m)+'</span>':"")
      +(b.final_score?' · Final <span class="num">'+esc(b.final_score)+'</span>':"")
      +'</div></div>';
  }
  return h+'</div>';
}

/* ---------- 5d. latest activity ---------- */
function activityHTML(){
  const acts=(S.activity||[]).slice(0,15);
  if(!acts.length) return "";
  let h='<h2 class="sec">Latest activity</h2><div class="card">';
  for(const a of acts){
    h+='<div class="item"><div class="t">'+esc(a.title||"")+'</div>'
      +'<div class="s">'+esc(a.agent||"")+' · '+when(a.at)+'</div>'
      +'<div class="s">'+esc(a.summary||"")+'</div></div>';
  }
  return h+'</div>';
}

/* ---------- 6. tucked sections ---------- */
function detailsBlock(title,inner){
  return '<details><summary>'+esc(title)+'</summary><div class="inner">'+inner+'</div></details>';
}
function workforceHTML(){
  const agents=S.agents||[];
  if(!agents.length) return "";
  let h="";
  for(const a of agents){
    h+='<div class="item"><div class="t">'+esc(a.name||"")+' <span class="tag">'+esc(a.status||"")+'</span></div>'
      +'<div class="s">'+esc(a.role||"")+'</div>'
      +'<div class="s">'+esc(a.headline||"")+'</div>'
      +'<div class="s">Last active: '+when(a.last_activity)+'</div></div>';
  }
  return detailsBlock("Workforce — the agents",h);
}
function stakehunterHTML(){
  const sh=S.stakehunter||{};
  const finds=sh.findings||[];
  if(!finds.length) return "";
  let h='<p class="mut">Latest cycle: '+num(sh.latest_cycle)+' · Showing '+finds.length+' findings.</p>';
  for(const f of finds){
    h+='<div class="item"><div class="t">'+esc(f.id||"")+' — '+esc(f.name||"")+' <span class="tag">'+esc(f.status||"")+'</span></div>'
      +'<div class="s">'+esc(f.verdict||"")+'</div></div>';
  }
  return detailsBlock("Stakehunter findings",h);
}
function autopsyHTML(){
  const ch=S.autopsy_challengers||[];
  if(!ch.length) return "";
  let h='<p class="mut">Challengers found by studying past losses. None of these is a king — a challenger still has to earn the crown the proper way.</p>';
  for(const c of ch){
    h+='<div class="item"><div class="t">'+esc(c.id||"")+' — '+esc(c.name||"")+'</div>'
      +'<div class="s num">'+rec(c.wins,c.losses)+' · <span class="'+cls(c.pnl_m)+'">'+m(c.pnl_m)+'</span> · '+pct(c.roi_pct)+'</div>'
      +'<div class="s">'+esc(c.status||"")+'</div></div>';
  }
  return detailsBlock("Autopsy challengers",h);
}
function researchHTML(){
  const r=S.research||{};
  const agents=r.agents||[], ex=r.exam||{};
  let h="";
  if(ex.games!=null){
    h+='<h3>Blind exam set</h3><div class="row"><span class="k">Games</span><span class="v num">'+num(ex.games)+' ('+num(ex.nba)+' NBA · '+num(ex.soccer)+' soccer)</span></div>';
    for(const ln of (ex.lines||[])){
      h+='<div class="row"><span class="k">'+esc(ln.court||"")+'</span><span class="v num">'+rec(ln.wins,ln.losses)+' · <span class="'+cls(ln.pnl_m)+'">'+m(ln.pnl_m)+'</span> · '+pct(ln.roi_pct)+'</span></div>';
    }
    if(ex.control) h+='<div class="row"><span class="k">Control (coin-flip line)</span><span class="v num">'+rec(ex.control.wins,ex.control.losses)+' · <span class="'+cls(ex.control.pnl_m)+'">'+m(ex.control.pnl_m)+'</span> · '+pct(ex.control.roi_pct)+'</span></div>';
    h+='<p class="mut">Graded '+esc(ex.graded_on||"")+'</p>';
  }
  for(const a of agents){
    h+='<div class="item"><div class="t">'+esc(a.name||"")+' <span class="tag">'+esc(a.group||"")+'</span></div>'
      +'<div class="s">'+esc(a.role||"")+' · Runs '+esc(a.cadence||"")+'</div>'
      +'<div class="s">'+esc(a.headline||"")+'</div>'
      +'<div class="s">Last active: '+when(a.last_activity)+'</div></div>';
  }
  return h?detailsBlock("Research workforce & exam",h):"";
}
function integrityHTML(){
  const g=S.integrity||{};
  if(!g||!Object.keys(g).length) return "";
  let h='<div class="row"><span class="k">Audit run</span><span class="v num">#'+num(g.run)+' · '+when(g.last_run)+'</span></div>'
    +'<div class="row"><span class="k">Vault seal</span><span class="v">'+esc(g.vault_seal||"")+'</span></div>'
    +'<div class="row"><span class="k">Registry</span><span class="v">'+esc(g.registry||"")+'</span></div>'
    +'<div class="row"><span class="k">Receipts</span><span class="v">'+esc(g.receipts||"")+'</span></div>'
    +'<div class="row"><span class="k">Canary gates / fixtures</span><span class="v num">'+num(g.canary_gates)+' / '+num(g.canary_fixtures)+'</span></div>'
    +'<div class="row"><span class="k">Findings on record</span><span class="v num">'+num(g.findings_count)+'</span></div>';
  for(const f of (g.findings||[])){
    h+='<div class="item"><div class="s">'+esc(f.summary||"")+'</div></div>';
  }
  return detailsBlock("Integrity audit",h);
}
function tuckedHTML(){
  const parts=[workforceHTML(),stakehunterHTML(),autopsyHTML(),researchHTML(),integrityHTML()].filter(Boolean);
  if(!parts.length) return "";
  return '<h2 class="sec">Behind the scenes</h2><p class="sec-sub">The working machinery — tap to open any part.</p>'+parts.join("");
}

/* ---------- render ---------- */
function render(){
  document.getElementById("updated").textContent="Updated "+when(S.generated_at);
  document.getElementById("content").innerHTML =
    summaryHTML()+totalsHTML()+kingsHTML()+compareHTML()+forwardHTML()
    +slipsHTML()+betsHTML()+activityHTML()+tuckedHTML();
}

/* ---------- loader: same contract as before — fetch status.json, re-check every 60s ---------- */
async function load(){
  try{
    const r = await fetch("status.json", {cache: "no-store"});
    if(!r.ok) throw new Error("HTTP " + r.status);
    S = await r.json();
    document.getElementById("fatal").innerHTML = "";
    render();
  }catch(err){
    if(!S) document.getElementById("fatal").innerHTML = '<div class="err">The desk could not load status.json (' + esc(err.message) + "). It will retry automatically.</div>";
  }
}
load();
setInterval(load, 60000);
</script>
